<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cidade Ativa - Ocorrências</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra superior -->
  <header class="topo">
    <a href="index.html" class="marca">
      <svg class="marca-icone" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2C8 7 5 10.5 5 14a7 7 0 0 0 14 0c0-3.5-3-7-7-12z" fill="#0e7490"/>
        <path d="M9 15l1.5-4 1.5 3 1.5-3 1.5 4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
      </svg>
      <span>
        <strong>Cidade Ativa</strong>
        <small>Da informação à solução</small>
      </span>
    </a>

    <nav>
      <a href="index.html">Início</a>
      <a href="ocorrencias.html" class="ativo">Ocorrências</a>
    </nav>

    <a href="index.html#registrar" class="botao-destaque">&#9998; Registrar ocorrência</a>
  </header>

  <main>

    <!-- Filtro -->
    <section class="caixa">
      <h2>Ocorrências</h2>
      <label for="filtro">Filtrar por tipo</label>
      <select id="filtro">
        <option value="">Todas</option>
        <option value="1">Falta de água</option>
        <option value="2">Falta de saneamento</option>
        <option value="3">Esgoto exposto</option>
        <option value="4">Saneamento básico</option>
      </select>
    </section>

    <!-- Mapa -->
    <section class="caixa">
      <div id="mapa"></div>
    </section>

    <!-- Lista -->
    <div id="lista"></div>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
  <script src="mapa.js"></script>
</body>
</html>
