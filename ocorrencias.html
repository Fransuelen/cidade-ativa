<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cidade Ativa - Ocorrências</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra superior -->
  <header class="topo">
    <a href="index.html" class="marca">
      <img src="logo.webp" alt="Logo Cidade Ativa" class="marca-icone">
      <span>
        <strong>Cidade Ativa</strong>
        <small>Da informação à solução</small>
      </span>
    </a>

    <nav>
      <a href="index.html">Início</a>
      <a href="ocorrencias.html" class="ativo">Ocorrências</a>
    </nav>

    <a href="index.html#registrar" class="botao-destaque">&#9998; Registrar ocorrência</a>
  </header>

  <main>

    <!-- Filtro -->
    <section class="caixa">
      <h2>Ocorrências</h2>
      <label for="filtro">Filtrar por tipo</label>
      <select id="filtro">
        <option value="">Todas</option>
        <option value="1">Falta de água</option>
        <option value="2">Falta de saneamento</option>
        <option value="3">Esgoto exposto</option>
        <option value="4">Saneamento básico</option>
      </select>
    </section>

    <!-- Mapa -->
    <section class="caixa">
      <h2>Mapa de Matão - SP</h2>
      <img src="mapa-matao.webp" alt="Mapa da cidade de Matão - SP com os bairros" class="mapa-cidade">
      <p class="credito">Mapa: &copy; colaboradores do OpenStreetMap</p>
    </section>

    <!-- Lista -->
    <div id="lista"></div>

  </main>

  <script src="script.js"></script>
</body>
</html>
